name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: mipsel
            goarch: mipsle
            gomips: softfloat
          - arch: mips
            goarch: mips
            gomips: softfloat
          - arch: aarch64
            goarch: arm64
          - arch: armv7
            goarch: arm
            goarm: 7
          - arch: x86_64
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Build binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOMIPS: ${{ matrix.gomips }}
          GOARM: ${{ matrix.goarm }}
        run: |
          BIN="dns-wan-transport-${{ matrix.arch }}"
          go build -ldflags "-s -w" -o "$BIN" ./cmd/dns-wan-transport
          ls -la "$BIN"
          file "$BIN"
      - name: Build .ipk package
        run: |
          chmod +x scripts/build-ipk.sh
          VERSION=${GITHUB_REF_NAME#v}
          ARCH=${{ matrix.arch }}
          BIN="dns-wan-transport-${{ matrix.arch }}"
          bash scripts/build-ipk.sh "$VERSION" "$ARCH" "$BIN"
      - uses: actions/upload-artifact@v4
        with:
          name: dns-wan-transport-${{ matrix.arch }}
          path: ipkg/*.ipk

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*.ipk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
